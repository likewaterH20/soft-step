// darkness pass: dim everything, then let every light in the frame cut through it
function drawLighting(dark){
  dk.globalCompositeOperation="source-over"; dk.clearRect(0,0,DK.width,DK.height); dk.fillStyle=`rgba(4,6,14,${dark})`; dk.fillRect(0,0,DK.width,DK.height);
  dk.globalCompositeOperation="destination-out";
  for(const L of FL){ const x=L.x/2,y=L.y/2,r=L.r/2; const g=dk.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(0,0,0,${L.a})`); g.addColorStop(1,"rgba(0,0,0,0)"); dk.fillStyle=g; dk.fillRect(x-r,y-r,r*2,r*2); }
  ctx.drawImage(DK,0,0,W,H);
  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(const L of FL){ if(!L.col||L.g<=0)continue; const r=L.r*.85, g=ctx.createRadialGradient(L.x,L.y,0,L.x,L.y,r); g.addColorStop(0,`rgba(${L.col},${Math.min(1,L.a*L.g*(STYLE===12?.45:1))})`); g.addColorStop(1,`rgba(${L.col},0)`); ctx.fillStyle=g; ctx.fillRect(L.x-r,L.y-r,r*2,r*2); }
  ctx.restore(); }

const keys=new Set(); const KMAP={ArrowLeft:"l",KeyA:"l",ArrowRight:"r",KeyD:"r"};

function anyKey(){ if(MODE==="title"){ start(); return true; } if((G.won||G.dead)&&G.endT>(G.dead?3.3:.9)){ start(); return true; } return false; }
addEventListener("keydown",e=>{ if(e.repeat){ if(e.code in KMAP||FIREK.has(e.code)||JUMPK.has(e.code))e.preventDefault(); return; }
  if(e.code==="KeyM"){ setMusic(!MUSIC); return; }
  if(e.code==="KeyH"){ toggleUI(); return; }
  if(e.code==="KeyR"&&userPaused){ userPaused=false; start(); return; }
  if(e.metaKey||e.ctrlKey)return;
  if(MODE==="title"||G.won||G.dead){ if(e.code==="Enter"||JUMPK.has(e.code)||FIREK.has(e.code)){ anyKey(); e.preventDefault(); } return; }
  if(e.code==="KeyP"||e.code==="Escape"){ togglePause(); e.preventDefault(); return; } if(userPaused)return;
  if(G.perk){ const k=G.perk; if(e.code==="Digit1"||e.code==="Digit2"||e.code==="Digit3")pickPerk(+e.code.slice(5)-1);
    else if(e.code in KMAP)k.sel=(k.sel+(KMAP[e.code]==="r"?1:2))%3; else if((e.code==="Enter"||JUMPK.has(e.code)||FIREK.has(e.code))&&k.t>.35)pickPerk(k.sel); e.preventDefault(); return; }
  if(JUMPK.has(e.code)){ jumpBuf=.12; jumpHeld=true; e.preventDefault(); }
  else if(FIREK.has(e.code)){ fireHeld=true; e.preventDefault(); }
  else if(e.code==="KeyC"||e.code==="KeyE"){ catAttack(); e.preventDefault(); }
  else if(e.code in KMAP){ keys.add(KMAP[e.code]); lastDirKey=KMAP[e.code]; e.preventDefault(); } });
addEventListener("keyup",e=>{ if(JUMPK.has(e.code))jumpHeld=false; if(FIREK.has(e.code))fireHeld=false; if(e.code in KMAP)keys.delete(KMAP[e.code]); });
addEventListener("blur",()=>{ keys.clear(); fireHeld=false; jumpHeld=false; });

  if(G.perk){ const r=canvas.getBoundingClientRect(), mx=(e.clientX-r.left)/r.width*W, my=(e.clientY-r.top)/r.height*H; for(let i=0;i<3;i++){ const c=perkRect(i); if(mx>c.x&&mx<c.x+c.w&&my>c.y&&my<c.y+c.h)pickPerk(i); } return; }
  if(e.button===2)catAttack(); else fireHeld=true; });

let padPrev={};
function pollPad(){ if(!navigator.getGamepads)return; let g=null; for(const x of navigator.getGamepads()){ if(x&&x.connected){ g=x; break; } } if(!g)return;
  const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed), ax=g.axes[0]||0, st={l:ax<-.35||b(14),r:ax>.35||b(15),jump:b(0),fire:b(2)||b(7)||b(5),cat:b(1)||b(3)||b(4),pause:b(9)};
  if(st.l)keys.add("l"); else if(padPrev.l)keys.delete("l"); if(st.r)keys.add("r"); else if(padPrev.r)keys.delete("r");
  if(st.jump&&!padPrev.jump){ if(!anyKey()){ jumpBuf=.12; jumpHeld=true; } } if(!st.jump&&padPrev.jump)jumpHeld=false;
  if(st.fire!==!!padPrev.fire){ if(st.fire){ if(!anyKey())fireHeld=true; } else fireHeld=false; }
  if(st.cat&&!padPrev.cat)catAttack(); if(st.pause&&!padPrev.pause)togglePause(); padPrev=st; }
// ---------- upgrades: every so many kills, pick one of three ----------
const PERKS=[
  {name:"THICK SKIN",   d:"+1 max health. heals you up.",  f:()=>{ G.maxhp++; G.hp=G.maxhp; }},
  {name:"HAIR TRIGGER", d:"every gun fires 25% faster.",   f:()=>{ G.mod.rof*=.75; }},
  {name:"HOLLOW POINTS",d:"a lot more headshots.",         f:()=>{ G.mod.crit+=.16; }},
  {name:"CATNIP",       d:"cats are ready twice as fast.", f:()=>{ G.mod.cat*=.5; }},
  {name:"DEEP POCKETS", d:"pickups carry 60% more ammo.",  f:()=>{ G.mod.mag*=1.6; }},
  {name:"SOFT STEP",    d:"move 15% faster.",              f:()=>{ G.mod.spd*=1.15; }},
  {name:"HOT LOADS",    d:"+1 damage on every bullet.",    f:()=>{ G.mod.dmg+=1; }},
  {name:"SHORT FUSE",   d:"1 in 4 kills blows up.",        f:()=>{ G.mod.pop+=.25; }} ];
const XPNEED=[10,24,42,64,90,120,155,195];
function perkRect(i){ return {x:W/2-330+i*220+8,y:H/2-78,w:204,h:176}; }
function offerPerk(){ const pool=PERKS.filter(pk=>!(pk.name==="SHORT FUSE"&&G.mod.pop>=.5)), opts=[];
  while(opts.length<3){ const pk=pool[Math.floor(Math.random()*pool.length)]; if(!opts.includes(pk))opts.push(pk); }
  G.perk={opts,sel:1,t:0}; fireHeld=false; keys.clear(); SFX.pick(); }
function pickPerk(i){ const k=G.perk; if(!k||!k.opts[i])return; k.opts[i].f(); G.taken.push(k.opts[i].name); G.perk=null; G.lvl++; G.invuln=Math.max(G.invuln,1.2);
  banner(k.opts[i].name,k.opts[i].d,GOLD); SFX.win(); last=performance.now(); }

function gunMuzzle(){ const p=G.p, mv=Math.abs(p.vx)>10||!p.onGround, sg=G.weapon==="shotgun"||G.flameT>0, cx=p.x+p.w/2;
  if(HR.rigs.op&&HR.rigs.op.ready){ const key=gunKey(), g=GUNS[key], im=IMG["g_"+key], u=p.h*HR.K/HR.CH, a=p.aimA||0, ca=Math.cos(a), sa=Math.sin(a), kk=p.kick||0, far=g.dual&&G.side===1, hx=g.hold[0]-kk*.55-(far?2.5:0), hy=g.hold[1]-(far?5:0),
      gw=g.L, gh=g.L*(im&&im.width?im.height/im.width:.3), lx=(g.muz[0]-g.grip[0])*gw, ly=(g.muz[1]-g.grip[1])*gh, mx=ca*hx-sa*hy+lx*ca-ly*sa, my=sa*hx+ca*hy+lx*sa+ly*ca;
    return {x:cx+p.face*mx*u, y:p.y+p.h-(51+25.8)*u+my*u, ang:p.face>0?a:Math.PI-a}; }
  if(mv){ const L=sg?51:36, a=p.aimA||0; return {x:cx+p.face*(2+Math.cos(a)*L+Math.sin(a)*4), y:p.y+p.h*.36+Math.sin(a)*L-Math.cos(a)*4, ang:p.face>0?a:Math.PI-a}; }   // running: end of the drawn gun arm
  const t=TIP[sg?"shotgun":"pistol"]; return {x:cx+p.face*t.x*p.h, y:p.y+t.y*p.h, ang:p.face>0?0:Math.PI}; }                                                   // standing: end of the barrel in the aim pose
// auto-aim: nearest thing worth shooting, with a bias for what is in front of you. a barrel sitting in a crowd counts.
function pickTarget(){ const p=G.p, px=p.x+p.w/2; let best=null, bs=1e9;
  for(const z of G.zombies){ if(z.dead)continue; const zx=z.x+z.w/2, d=Math.abs(zx-px); if(d>480||zx<G.camX-30||zx>G.camX+VW+30)continue;
    const s=d*(((zx-px)*p.mface>=0)?1:1.7)+((p.atkT>0&&d<66)?420:0)+(z.thrown?900:0); if(s<bs){ bs=s; best=z; } }
  for(const pl of G.platforms){ if(pl.type!=="barrels")continue; const bx=pl.x+pl.w/2, d=Math.abs(bx-px); if(d<170||d>520||(bx-px)*p.mface<0)continue;
