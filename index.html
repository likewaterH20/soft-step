  if(G.taken.length)txt([...new Set(G.taken)].map(n=>{ const c=G.taken.filter(x=>x===n).length; return c>1?n+" ×"+c:n; }).join("   ·   "),W/2,y+150,9,"rgba(255,207,107,.7)","center",800,2);
  if(G.newBest)txt("NEW BEST",W/2,y+172,11,GOLD,"center",800,5); else if(BEST>0)txt("BEST  "+BEST.toLocaleString(),W/2,y+172,10,"rgba(244,237,224,.45)","center",800,3);
  if(G.endT>.9&&Math.floor(G.endT*1.6)%2)txt(won?"SPACE  —  GO AGAIN":(LV>0&&LVSAVE?"SPACE  —  RETRY LEVEL "+(LV+1):"SPACE  —  TRY AGAIN"),W/2,H-58,12,BONE,"center",800,5); ctx.globalAlpha=1; }
function drawPerk(){ const k=G.perk; shade(.74); txt("LEVEL "+(G.lvl+2),W/2,H/2-124,11,GOLD,"center",800,5); txt("PICK ONE",W/2,H/2-96,26,BONE,"center",800,7);
  for(let i=0;i<3;i++){ const r=perkRect(i), sel=i===k.sel, pk=k.opts[i]; ctx.fillStyle=sel?"rgba(26,24,20,.96)":"rgba(12,13,18,.94)"; ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeStyle=sel?GOLD:"rgba(255,255,255,.14)"; ctx.lineWidth=sel?2:1; ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1); if(sel){ ctx.fillStyle=GOLD; ctx.fillRect(r.x,r.y,r.w,3); }
    txt(""+(i+1),r.x+16,r.y+30,11,sel?GOLD:"rgba(244,237,224,.4)","left",800,1); txt(pk.name,r.x+r.w/2,r.y+84,16,sel?GOLD:BONE,"center",800,2.5); txt(pk.d,r.x+r.w/2,r.y+112,11,"rgba(244,237,224,.7)","center",500,.3); }
  txt("1  2  3   OR   A / D  +  SPACE",W/2,H/2+128,10,"rgba(244,237,224,.5)","center",800,3); }

// ---------- loop ----------
let last=performance.now(),acc=0,paused=false,userPaused=false; const STEP=1/60;
const dev=QS.has("dev"); if(dev)document.getElementById("dev").style.display="block";
document.addEventListener("visibilitychange",()=>{ paused=document.hidden; if(!paused)last=performance.now(); if(AC&&RAING){ RAING.gain.setTargetAtTime(!MUSIC?0:document.hidden?.004:G.rainAmt*RAINV,AC.currentTime,.1); applyMusic(true); } });
function togglePause(){ if(MODE!=="play"||G.won||G.dead||G.perk)return; userPaused=!userPaused; fireHeld=false; jumpHeld=false; jumpBuf=0; keys.clear(); last=performance.now(); }
function drawFlow(){
  if(G.clearT>0){ const a=Math.max(0,Math.min(1,(G.clearT-1.1)/1.0)); txt("LEVEL CLEAR",W/2,H*.34,40,GOLD,"center",800,8); ctx.fillStyle=GOLD; ctx.fillRect(W/2-30,H*.34+12,60,2); txt("+"+(1000+G.hp*300).toLocaleString(),W/2,H*.34+34,13,"rgba(244,237,224,.8)","center",800,3); shade(a); }
  if(G.fadeIn>0)shade(Math.min(1,G.fadeIn));
  if(G.card>0&&MODE==="play"){ const a=Math.max(0,Math.min(1,G.card*1.4,(3.6-G.card)*2)); ctx.globalAlpha=a; txt("LEVEL "+(LV+1),W/2,H*.40,12,RED,"center",800,6); txt(LEVEL.name,W/2,H*.40+44,44,BONE,"center",800,8+G.card*1.5); ctx.fillStyle=RED; ctx.fillRect(W/2-36,H*.40+60,72,3); ctx.globalAlpha=1; } }
function present(){ render(); if(MODE==="play"&&G.chaos)drawChaosFx(); else if(MODE==="play"&&G.intro)drawIntroFx(); else if(MODE==="play"&&!G.dead&&!G.won){ if(G.fin)drawFinFx(); else { drawCine(); drawFlow(); } };
  if(MODE==="title")drawTitle(); else if(G.won||G.dead)drawEnd(); else if(G.perk)drawPerk();
  else if(userPaused){ shade(.7); txt("PAUSED",W/2,H/2-6,46,BONE,"center",800,10); txt("P  RESUME      H  CONTROLS      M  SOUND "+(MUSIC?"ON":"OFF")+"      R  RESTART",W/2,H/2+30,11,"rgba(244,237,224,.6)","center",800,3); } }
let HOLD=false, FDT=1;
function frame(now){ requestAnimationFrame(frame); if(paused||HOLD||(TOUCHMODE&&innerHeight>innerWidth)){ last=now; return; } let dt=(now-last)/1000; last=now; if(dt>.1)dt=.1; pollPad();
  if(MODE==="title"){ G.t+=dt; ambient(dt); }
  else if(!userPaused){ if(G.perk)G.perk.t+=dt; else { acc+=dt; while(acc>=STEP){ update(STEP); acc-=STEP; if(G.perk){ acc=0; break; } } } }
  { const al=(MODE==="play"&&!userPaused&&!G.perk)?acc/STEP:1; FDT=Math.max(.25,Math.min(3,dt*60)); lerpState(al); present(); lerpState(-1); FDT=1; }
  if(AC&&RAING){ RAING.gain.setTargetAtTime(MUSIC?G.rainAmt*(userPaused?.003:RAINV):0,AC.currentTime,.25); DRONEG.gain.setTargetAtTime(musicLevel(),AC.currentTime,.2); }
  if(dev)document.getElementById("dev").textContent="z"+G.zombies.length+" k"+G.kills+" hp"+G.hp+" p"+G.parts.length+" L"+FL.length; }
build(); requestAnimationFrame(frame);
const DBG=document.createElement("canvas");
window.SS={ CR, HR, vehHit, platTop, BKILL, bigfin:(ki)=>{ const p=G.p, px=p.x+p.w/2; let b=null, bd=1e9; for(const z of G.zombies){ if(z.dead||(!z.boss&&z.tier!==3)||z.thrown||z.carried||z.emT>0||z.fly)continue; const d=Math.abs(z.x+z.w/2-px); if(d<bd){ bd=d; b=z; } } if(b&&!G.fin)startFin(b,ki); return !!G.fin; }, SKILL, sfin:(i)=>{ const S=G.stealth; if(!S||!S.tgt||G.fin)return false; startFin(S.tgt,null,0,3,SKILL[i]); S.kills++; return true; }, roll:()=>{ ROLLREQ=1; }, FKILL, FOPEN, CKILL, catDo:(ki)=>{ const bc=G.bigCat; if(!bc||bc.act||!(G.p.vicious>0))return false; let b=null, bd=1e9; for(const z of G.zombies){ if(z.dead||z.thrown||z.emT>0||z.fly||z.carried)continue; const d=Math.abs(z.x+z.w/2-bc.x); if(d<bd){ bd=d; b=z; } } if(!b)return false; catActStart(bc,b,ki); return true; }, fin:(k,o,c)=>{ const p=G.p, px=p.x+p.w/2; let b=null, bd=1e9; for(const z of G.zombies){ if(z.dead||z.boss||z.tier>2||z.thrown||z.carried||z.emT>0||z.fly)continue; const d=Math.abs(z.x+z.w/2-px); if(d<bd){ bd=d; b=z; } } if(b&&!G.fin)startFin(b,k,o,c); return !!G.fin; }, rig:(name,c,M)=>{ if(!crReady(name))return null; return catRig(name,c||{spd:0,gait:0},M||3,DBG); }, rebuild:(name)=>{ delete CR.rigs[name]; return crReady(name); }, style:(n)=>{STYLE=n;}, hold:(v)=>{HOLD=!!v;}, get G(){return G;}, get lv(){return LV;}, goto:(n)=>{ LV=n; LVSAVE=n>0?{}:null; build({}); G.card=3.6; MODE="play"; }, get mode(){return MODE;}, get zoom(){return ZOOM;}, get paused(){return userPaused;}, resume:()=>{userPaused=false;}, reset:start, start, setZoom, pickPerk,
  step:(n)=>{ for(let i=0;i<(n||1);i++){ if(G.perk)break; update(1/60); } present(); }, tick:()=>{ if(!G.perk)update(1/60); }, draw:present };
